[workspace]
members = [
    "crates/nxnd-core",
    "crates/nxnd-cli",
    "crates/clean-agent",
    "crates/open-gratitude",
    "crates/shipit",
    "crates/personal-coding-memory",
    "crates/vector-search",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NexusDev Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.22"
tree-sitter-rust = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
prettytable-rs = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
